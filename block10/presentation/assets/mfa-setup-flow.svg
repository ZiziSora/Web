<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 430" role="img" aria-labelledby="title desc"><title id="title">Sơ đồ bật hoặc thay Authenticator</title><desc id="desc">Từ Settings, xác thực mật khẩu và yếu tố cũ nếu có, tạo secret và QR tạm, xác minh TOTP mới, rồi mới lưu MFA chính thức và cấp recovery code. Sai hoặc hết hạn không thay secret đang dùng.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637386"/></marker></defs><style>text{font:600 21px "Segoe UI",Arial,sans-serif;fill:#083b79}.label{font-size:18px;font-weight:500;fill:#637386}</style><rect x="10" y="70" width="185" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="102.5" y="112.0" text-anchor="middle">Settings</text><text x="102.5" y="140.0" text-anchor="middle">Bật / thay MFA</text><rect x="240" y="70" width="215" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="347.5" y="112.0" text-anchor="middle">Mật khẩu hiện tại</text><text x="347.5" y="140.0" text-anchor="middle">+ yếu tố cũ¹</text><rect x="500" y="70" width="205" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="602.5" y="112.0" text-anchor="middle">Secret + QR tạm</text><text x="602.5" y="140.0" text-anchor="middle">Hạn 5 phút</text><rect x="750" y="70" width="180" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="840.0" y="112.0" text-anchor="middle">Nhập TOTP</text><text x="840.0" y="140.0" text-anchor="middle">của secret mới</text><rect x="975" y="70" width="199" height="98" rx="8" fill="#e7f4ed" stroke="#087146" stroke-width="2"/><text x="1074.5" y="112.0" text-anchor="middle">Xác nhận đúng</text><text x="1074.5" y="140.0" text-anchor="middle">Lưu MFA mới</text><rect x="550" y="285" width="300" height="98" rx="8" fill="#fff2f4" stroke="#df1740" stroke-width="2"/><text x="700.0" y="327.0" text-anchor="middle">Sai / hết hạn</text><text x="700.0" y="355.0" text-anchor="middle">Giữ trạng thái MFA cũ</text><rect x="930" y="285" width="244" height="98" rx="8" fill="#e7f4ed" stroke="#087146" stroke-width="2"/><text x="1052.0" y="327.0" text-anchor="middle">10 recovery code</text><text x="1052.0" y="355.0" text-anchor="middle">Thu hồi mọi phiên</text><polyline points="195,119 240,119" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="455,119 500,119" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="705,119 750,119" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="930,119 975,119" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="952" y="102" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Đúng</text><polyline points="840,168 840,236 700,236 700,285" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="790" y="222" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Sai</text><polyline points="1074,168 1074,285" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/></svg>