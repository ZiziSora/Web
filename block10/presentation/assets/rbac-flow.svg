<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 430" role="img" aria-labelledby="title desc"><title id="title">Sơ đồ luồng phân quyền tại API</title><desc id="desc">Request được kiểm tra JWT, tài khoản và phiên trong database, rồi kiểm tra role theo thao tác. Xác thực sai trả 401, thiếu quyền trả 403, đủ quyền đi tiếp tới nghiệp vụ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637386"/></marker></defs><style>text{font:600 21px "Segoe UI",Arial,sans-serif;fill:#083b79}.label{font-size:18px;font-weight:500;fill:#637386}</style><rect x="10" y="62" width="180" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="100.0" y="104.0" text-anchor="middle">Request</text><text x="100.0" y="132.0" text-anchor="middle">Bearer token</text><rect x="245" y="62" width="205" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="347.5" y="104.0" text-anchor="middle">Kiểm tra JWT</text><text x="347.5" y="132.0" text-anchor="middle">chữ ký / hạn</text><rect x="505" y="62" width="235" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="622.5" y="104.0" text-anchor="middle">Đọc user / session</text><text x="622.5" y="132.0" text-anchor="middle">active / version</text><rect x="795" y="62" width="165" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="877.5" y="104.0" text-anchor="middle">Role được</text><text x="877.5" y="132.0" text-anchor="middle">phép?</text><rect x="1010" y="62" width="164" height="98" rx="8" fill="#e7f4ed" stroke="#087146" stroke-width="2"/><text x="1092.0" y="104.0" text-anchor="middle">CSRF¹</text><text x="1092.0" y="132.0" text-anchor="middle">→ Nghiệp vụ</text><rect x="355" y="278" width="300" height="98" rx="8" fill="#fff2f4" stroke="#df1740" stroke-width="2"/><text x="505.0" y="320.0" text-anchor="middle">401 · Chưa xác thực</text><text x="505.0" y="348.0" text-anchor="middle">hoặc phiên hết hiệu lực</text><rect x="760" y="278" width="260" height="98" rx="8" fill="#fff2f4" stroke="#df1740" stroke-width="2"/><text x="890.0" y="320.0" text-anchor="middle">403 · FORBIDDEN</text><text x="890.0" y="348.0" text-anchor="middle">Không đủ quyền</text><polyline points="190,111 245,111" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="450,111 505,111" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="740,111 795,111" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="960,111 1010,111" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="985" y="94" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Có</text><polyline points="347,160 347,232 425,232 425,278" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="328" y="204" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Sai</text><polyline points="622,160 622,232 585,232 585,278" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="647" y="204" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Sai</text><polyline points="877,160 877,278" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="915" y="224" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Không</text></svg>