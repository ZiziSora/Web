<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 460" role="img" aria-labelledby="title desc"><title id="title">Sơ đồ đăng nhập với MFA</title><desc id="desc">Đăng nhập kiểm tra mật khẩu, trạng thái tài khoản và CAPTCHA theo quy tắc. Nếu chưa bật MFA thì cấp phiên; nếu đã bật thì chỉ tạo challenge 5 phút. TOTP hoặc recovery hợp lệ mới cấp access và refresh. Sai năm lần khóa xác minh 15 phút.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637386"/></marker></defs><style>text{font:600 21px "Segoe UI",Arial,sans-serif;fill:#083b79}.label{font-size:18px;font-weight:500;fill:#637386}</style><rect x="10" y="45" width="185" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="102.5" y="87.0" text-anchor="middle">POST /login</text><text x="102.5" y="115.0" text-anchor="middle">Email / password</text><rect x="240" y="45" width="235" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="357.5" y="87.0" text-anchor="middle">Password / active</text><text x="357.5" y="115.0" text-anchor="middle">CAPTCHA / giới hạn</text><rect x="525" y="45" width="205" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="627.5" y="101.0" text-anchor="middle">MFA đang bật?</text><rect x="800" y="45" width="374" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="987.0" y="87.0" text-anchor="middle">Challenge 5 phút · cookie HttpOnly</text><text x="987.0" y="115.0" text-anchor="middle">Chưa cấp access / refresh</text><rect x="235" y="269" width="240" height="98" rx="8" fill="#fff2f4" stroke="#df1740" stroke-width="2"/><text x="355.0" y="311.0" text-anchor="middle">Từ chối đăng nhập</text><text x="355.0" y="339.0" text-anchor="middle">Không cấp grant</text><rect x="525" y="269" width="205" height="98" rx="8" fill="#e7f4ed" stroke="#087146" stroke-width="2"/><text x="627.5" y="311.0" text-anchor="middle">Cấp JWT access</text><text x="627.5" y="339.0" text-anchor="middle">+ refresh cookie</text><rect x="800" y="210" width="374" height="98" rx="8" fill="#f3f6f9" stroke="#0874bb" stroke-width="2"/><text x="987.0" y="252.0" text-anchor="middle">POST /mfa/verify</text><text x="987.0" y="280.0" text-anchor="middle">TOTP hoặc recovery code</text><rect x="800" y="365" width="374" height="78" rx="8" fill="#fff2f4" stroke="#df1740" stroke-width="2"/><text x="987.0" y="397.0" text-anchor="middle">Sai 5 lần → khóa 15 phút</text><text x="987.0" y="425.0" text-anchor="middle">429 + Retry-After</text><polyline points="195,94 240,94" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="475,94 525,94" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="500" y="77" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Đúng</text><polyline points="730,94 800,94" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="764" y="77" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Có</text><polyline points="357,143 357,269" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="335" y="216" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Sai</text><polyline points="627,143 627,269" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="661" y="216" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Không</text><polyline points="987,143 987,210" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="800,259 765,259 765,318 730,318" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="760" y="245" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Đúng¹</text><polyline points="987,308 987,365" fill="none" stroke="#637386" stroke-width="2.5" marker-end="url(#arrow)"/><text class="label" x="1012" y="344" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7">Sai</text></svg>